openapi: 3.1.0
info:
  title: Workflow Gateway External API
  version: 1.0.0
  summary: Proposed external workflow capability API contract
  description: |
    Planning-only OpenAPI contract for authorised external assistants and applications.
    This API is not implemented or deployed. The identity-provider URLs and API server
    below are reserved .invalid placeholders and must be replaced only after the
    owner approves an identity provider, deployment environment and integration.
    Every operation must reuse Workflow Gateway's shared registry, entitlement,
    approval, execution, audit and file-access services.
servers:
  - url: https://api.workflow-gateway.example.invalid/v1
    description: Reserved placeholder; no live service exists.
tags:
  - name: Discovery
  - name: Workflows
  - name: Executions
  - name: Files
security:
  - ExternalOAuth:
      - capabilities:read
paths:
  /capabilities:
    get:
      tags: [Discovery]
      operationId: listCapabilities
      summary: List capabilities available to the authenticated principal
      description: |
        Results are filtered by current principal, workspace access, workflow lifecycle,
        external visibility, entitlement and granted scopes. Hidden workflows must not
        leak through result counts, suggestions or distinguishable error responses.
      security:
        - ExternalOAuth: [capabilities:read]
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string, maxLength: 200 }
        - name: cursor
          in: query
          required: false
          schema: { type: string, maxLength: 2048 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: Permission-filtered capability page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilityPage'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }

  /workflows/{workflowId}:
    get:
      tags: [Workflows]
      operationId: getWorkflow
      summary: Get a workflow description and schemas
      security:
        - ExternalOAuth: [workflows:read]
      parameters:
        - $ref: '#/components/parameters/WorkflowId'
        - name: version
          in: query
          required: false
          schema: { type: string, maxLength: 64 }
      responses:
        '200':
          description: Workflow metadata visible to this principal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowDetails'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }

  /executions:
    post:
      tags: [Executions]
      operationId: createExecution
      summary: Submit an authorised workflow execution
      description: |
        The server derives the authenticated principal and authoritative workspace
        context from the validated credential. Any workspace selector supplied in
        the request must be independently checked and is never trusted as authority.
        The server re-checks lifecycle, entitlement, scopes and approval policy.
        Use an idempotency key to make safe retries possible.
      security:
        - ExternalOAuth: [executions:write]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 16, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutionRequest'
      responses:
        '202':
          description: Execution accepted for asynchronous processing or approval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionAcknowledgement'
        '200':
          description: Execution completed synchronously
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionResult'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Idempotency key reused with a different request digest
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /executions/{executionId}:
    get:
      tags: [Executions]
      operationId: getExecutionStatus
      summary: Get execution status and permitted progress
      security:
        - ExternalOAuth: [executions:read]
      parameters:
        - $ref: '#/components/parameters/ExecutionId'
      responses:
        '200':
          description: Current execution status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionStatus'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /executions/{executionId}/cancel:
    post:
      tags: [Executions]
      operationId: cancelExecution
      summary: Request cancellation when supported
      security:
        - ExternalOAuth: [executions:cancel]
      parameters:
        - $ref: '#/components/parameters/ExecutionId'
      responses:
        '202':
          description: Cancellation request accepted; final state is reported by status polling
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionAcknowledgement'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Execution is terminal or cannot be cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /executions/{executionId}/result:
    get:
      tags: [Executions]
      operationId: getExecutionResult
      summary: Retrieve a completed execution result
      security:
        - ExternalOAuth: [executions:read]
      parameters:
        - $ref: '#/components/parameters/ExecutionId'
      responses:
        '200':
          description: Validated structured result and protected file references
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionResult'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Result is not ready or execution is not in a result-bearing state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /files/{fileId}:
    get:
      tags: [Files]
      operationId: downloadExecutionFile
      summary: Download a file through a permission-checked endpoint
      description: |
        File access is private by default. The server re-checks the caller grant,
        owning execution/workspace and reference expiry. Do not return permanent
        public storage URLs.
      security:
        - ExternalOAuth: [files:read]
      parameters:
        - name: fileId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '200':
          description: File content
          headers:
            Content-Disposition:
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410':
          description: File reference expired or file retention ended
        '429': { $ref: '#/components/responses/RateLimited' }

components:
  securitySchemes:
    ExternalOAuth:
      type: oauth2
      description: |
        Proposed delegated OAuth authorisation. Authorisation and token URLs are
        placeholders. Interactive clients should use authorisation-code flow with
        PKCE after provider validation. Non-interactive clients may use a separately
        approved machine identity where supported. Client support varies; ChatGPT
        MCP connection requirements must be validated independently.
      flows:
        authorizationCode:
          authorizationUrl: https://identity.workflow-gateway.example.invalid/oauth/authorize
          tokenUrl: https://identity.workflow-gateway.example.invalid/oauth/token
          scopes:
            capabilities:read: Discover permitted capabilities
            workflows:read: Read permitted workflow descriptions and schemas
            executions:write: Submit permitted workflow executions
            executions:read: Read permitted execution status and results
            executions:cancel: Request cancellation of permitted executions
            files:read: Download permitted generated files
        clientCredentials:
          tokenUrl: https://identity.workflow-gateway.example.invalid/oauth/token
          scopes:
            capabilities:read: Discover permitted capabilities
            workflows:read: Read permitted workflow descriptions and schemas
            executions:write: Submit permitted workflow executions
            executions:read: Read permitted execution status and results
            executions:cancel: Request cancellation of permitted executions
            files:read: Download permitted generated files
      x-pkce-required-for-authorization-code: true

  parameters:
    WorkflowId:
      name: workflowId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }
    ExecutionId:
      name: executionId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Malformed request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthenticated:
      description: Missing, invalid, expired or revoked credential
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authenticated principal lacks the required permission or entitlement
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource unavailable or not visible to this principal
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Request failed schema or business-rule validation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Client, principal or workspace rate/concurrency limit exceeded
      headers:
        Retry-After:
          schema: { type: integer, minimum: 0 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServerError:
      description: Unexpected server error; response must not expose internal details
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unavailable:
      description: Execution service temporarily unavailable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    CapabilityPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Capability' }
        nextCursor:
          type: [string, 'null']
    Capability:
      type: object
      required: [workflowId, name, version, description, capabilities]
      properties:
        workflowId: { type: string }
        name: { type: string }
        version: { type: string }
        description: { type: string }
        capabilities:
          type: array
          items: { type: string }
        executionMode:
          type: string
          enum: [sync, async]
        approvalMayBeRequired: { type: boolean }
    WorkflowDetails:
      allOf:
        - $ref: '#/components/schemas/Capability'
        - type: object
          required: [inputSchema, outputSchema]
          properties:
            inputSchema:
              type: object
              description: JSON Schema for validated execution inputs
              additionalProperties: true
            outputSchema:
              type: object
              description: JSON Schema for validated execution outputs
              additionalProperties: true
            requiredScopes:
              type: array
              items: { type: string }
    ExecutionRequest:
      type: object
      required: [workflowId, version, inputs]
      properties:
        workflowId: { type: string }
        version: { type: string }
        inputs:
          type: object
          additionalProperties: true
        workspaceSelector:
          type: string
          description: Optional selector only; server must verify membership and access.
        callbackReference:
          type: string
          description: Optional registered callback reference; arbitrary callback URLs are not accepted.
    ExecutionAcknowledgement:
      type: object
      required: [executionId, status, statusUrl]
      properties:
        executionId: { type: string, format: uuid }
        status:
          type: string
          enum: [queued, running, awaiting_approval, succeeded, failed, cancelled, timed_out]
        statusUrl: { type: string, format: uri-reference }
        approvalPending: { type: boolean, default: false }
    ExecutionStatus:
      type: object
      required: [executionId, workflowId, version, status, updatedAt]
      properties:
        executionId: { type: string, format: uuid }
        workflowId: { type: string }
        version: { type: string }
        status:
          type: string
          enum: [queued, running, awaiting_approval, succeeded, failed, cancelled, timed_out]
        progress:
          type: object
          additionalProperties: true
          description: Safe, non-sensitive progress metadata only.
        updatedAt: { type: string, format: date-time }
        error:
          $ref: '#/components/schemas/Error'
    ExecutionResult:
      type: object
      required: [executionId, status, output]
      properties:
        executionId: { type: string, format: uuid }
        status:
          type: string
          enum: [succeeded, failed, cancelled, timed_out]
        output:
          type: object
          additionalProperties: true
        files:
          type: array
          items: { $ref: '#/components/schemas/FileReference' }
        completedAt: { type: string, format: date-time }
        error:
          $ref: '#/components/schemas/Error'
    FileReference:
      type: object
      required: [fileId, name, mediaType, expiresAt]
      properties:
        fileId: { type: string }
        name: { type: string }
        mediaType: { type: string }
        sizeBytes: { type: integer, minimum: 0 }
        expiresAt: { type: string, format: date-time }
    Error:
      type: object
      required: [code, message, retryable, correlationId]
      properties:
        code: { type: string }
        message: { type: string }
        retryable: { type: boolean }
        correlationId: { type: string }
        details:
          type: object
          additionalProperties: true
          description: Safe validation details only; never include secrets or stack traces.
